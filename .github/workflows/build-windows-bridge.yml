name: Build TimbangQR Bridge for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, feat/windows-operator-bridge]
    paths:
      - "bridge-desktop/**"
      - "serial-agent/**"
      - "package.json"
      - ".github/workflows/build-windows-bridge.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Validate Bridge JavaScript syntax
        run: node --check bridge-desktop/main.cjs
      - run: npm run bridge:build
      - name: Smoke test packaged Windows Bridge
        shell: pwsh
        run: |
          $app = Join-Path $PWD "dist\win-unpacked\TimbangQR Bridge.exe"
          if (!(Test-Path $app)) { throw "Executable hasil packaging tidak ditemukan." }
          $process = Start-Process -FilePath $app -PassThru
          $headers = @{ "x-bridge-key" = "bridge-admin-key-ganti-sebelum-produksi" }
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            Start-Sleep -Milliseconds 500
            if ($process.HasExited) { throw "TimbangQR Bridge berhenti saat smoke test." }
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -Headers $headers -TimeoutSec 2
              if ($health.ok) { $ready = $true; break }
            } catch {}
          }
          if (!$ready) { throw "Serial Agent bawaan tidak aktif pada port 8787." }
          taskkill /PID $process.Id /T /F
      - uses: actions/upload-artifact@v4
        with:
          name: TimbangQR-Bridge-Windows
          path: dist/TimbangQR-Bridge-Setup-*.exe
          if-no-files-found: error
